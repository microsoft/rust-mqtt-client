# Benchmark tooling workspace: the instrumented client harness (`bench_client`) and the controlled
# peer it talks to (`bench_peer`). Grouped so `cargo {build,clippy,fmt}` covers both at once.
#
# This is a DETACHED workspace: the root `ms-mqtt-client` package has no `[workspace]`, so this
# `[workspace]` becomes its own root and never enters the library's build graph, PR gate, or
# minimal-versions resolution. `bench_peer` deliberately does not depend on `ms-mqtt-client` (see
# its manifest); sharing this workspace only shares target/ and the lockfile, not linkage.
[workspace]
resolver = "3"
members = ["bench_client", "bench_peer"]
