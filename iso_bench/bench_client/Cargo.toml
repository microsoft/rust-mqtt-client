[package]
name = "bench_client"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
bytes = "1"
# getrusage, for CPU/RSS bracketed to the measured window instead of the whole process
# (see src/usage.rs). Already in the lockfile via tokio, so this pins nothing new.
libc = "0.2"
hdrhistogram = { version = "7", default-features = false }
tokio = { version = "1.38.2", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "time",
] }

[dependencies.ms-mqtt-client]
path = "../.."

[[bin]]
name = "bench_client"
path = "src/main.rs"
test = false
doc = false
bench = false
