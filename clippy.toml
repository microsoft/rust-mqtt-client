disallowed-macros = [
    { path = "futures::pin_mut", reason = "use std::pin::pin! instead" },
    { path = "futures_util::pin_mut", reason = "use std::pin::pin! instead" },
]

disallowed-methods = [
    { path = "futures_util::future::pending", reason = "use std::future::pending instead" },
    { path = "futures_util::future::ready", reason = "use std::future::ready instead" },
]

disallowed-types = [
    { path = "std::sync::Mutex", reason = "use parking_lot::Mutex instead" },
    { path = "once_cell::sync::OnceCell", reason = "use std::sync::OnceLock instead" },
    { path = "once_cell::unsync::OnceCell", reason = "use std::cell::OnceCell instead" },
    { path = "tokio::sync::Mutex", reason = "use parking_lot::Mutex or futures_util::lock::Mutex instead", allow-invalid = true},
]

doc-valid-idents = ["MiB", "PUBLISHes", "QoS"]
