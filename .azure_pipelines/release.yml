# Manual ESRP release pipeline for crates.io.
#
# Create the Azure DevOps pipeline through StartRight and point it at this file.
# Before enabling publication:
# - Replace REPLACE_WITH_APPROVED_1ES_HOSTED_POOL with the shared pool confirmed
#   by 1ES Resource Management, or with a dedicated 1ES Hosted Pool provisioned
#   for this service. Do not use the legacy Azure Pipelines pool or the stale
#   Azure-Pipelines-CI-Prod-EO pool.
# - Replace REPLACE_WITH_POOL_LINUX_IMAGE with the exact Linux image name
#   configured in that pool.
# - Replace REPLACE_WITH_POOL_WINDOWS_IMAGE with the exact Windows image name
#   configured in the same pool for 1ES SDL source analysis.
# - Create and authorize the ms-mqtt-client-esrp variable group referenced
#   below. Define ESRP_SERVICE_CONNECTION, ESRP_KEYVAULT_NAME,
#   ESRP_SIGN_CERT_NAME, ESRP_CLIENT_ID, ESRP_OWNERS, ESRP_APPROVERS, and
#   ESRP_DOMAIN_TENANT_ID before creating this pipeline definition.
# - Production publication is queued from main. The commit must already have a
#   v<Cargo version> tag (for example, v0.1.0).

trigger: none
pr: none

parameters:
  - name: dryRun
    displayName: Dry run (package only; do not publish)
    type: boolean
    default: true

variables:
  - group: ms-mqtt-client-esrp
  - name: CARGO_TERM_COLOR
    value: always
  - name: crateName
    value: ms-mqtt-client

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    # Pool selection is a compile-time 1ES PT input. Replace these with literal
    # checked-in values; do not use $(runtimeVariables) or a variable group.
    pool:
      name: REPLACE_WITH_APPROVED_1ES_HOSTED_POOL
      image: REPLACE_WITH_POOL_LINUX_IMAGE
      os: linux

    sdl:
      sourceAnalysisPool:
        name: REPLACE_WITH_APPROVED_1ES_HOSTED_POOL
        image: REPLACE_WITH_POOL_WINDOWS_IMAGE
        os: windows

    stages:
      - stage: Build
        displayName: Package crate
        jobs:
          - job: Package
            displayName: Package ms-mqtt-client
            timeoutInMinutes: 30
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)/esrp-release
                  artifactName: ms-mqtt-client-crate
            steps:
              - checkout: self
                clean: true
                fetchDepth: 0
                fetchTags: true

              - task: RustInstaller@1
                displayName: Install Rust 1.88
                inputs:
                  rustVersion: ms-prod-1.88
                  toolchainFeed: https://pkgs.dev.azure.com/github-private/microsoft/_packaging/RustTools/nuget/v3/index.json
                  cratesIoFeedOverride: sparse+https://pkgs.dev.azure.com/github-private/microsoft/_packaging/Rust/Cargo/index/

              - bash: |
                  set -euo pipefail

                  source_branch="$(Build.SourceBranch)"
                  if [[ "$source_branch" != refs/heads/main ]]; then
                    echo "##vso[task.logissue type=error]Publishing is allowed only from refs/heads/main."
                    exit 1
                  fi

                  crate_package_id="$(cargo pkgid --locked --package "$(crateName)")"
                  crate_version="${crate_package_id##*@}"

                  if [[ -z "$crate_version" || "$crate_version" == "$crate_package_id" ]]; then
                    echo "##vso[task.logissue type=error]Could not read $(crateName) version from its Cargo package ID."
                    exit 1
                  fi

                  expected_tag="v$crate_version"
                  tag_commit="$(git rev-list -n 1 "$expected_tag" 2>/dev/null || true)"
                  source_commit="$(git rev-parse HEAD)"

                  if [[ -z "$tag_commit" ]]; then
                    echo "##vso[task.logissue type=error]Required release tag $expected_tag does not exist."
                    exit 1
                  fi

                  if [[ "$tag_commit" != "$source_commit" ]]; then
                    echo "##vso[task.logissue type=error]Tag $expected_tag does not point to source commit $source_commit."
                    exit 1
                  fi
                displayName: Validate production branch and release tag
                condition: and(succeeded(), eq(${{ parameters.dryRun }}, false))

              - bash: |
                  set -euo pipefail

                  release_dir="$(Build.ArtifactStagingDirectory)/esrp-release"
                  target_dir="$(Build.SourcesDirectory)/target"
                  rm -rf "$release_dir"
                  mkdir -p "$release_dir"

                  CARGO_TARGET_DIR="$target_dir" cargo package --locked

                  shopt -s nullglob
                  crate_files=("$target_dir/package/$(crateName)-"*.crate)
                  if [[ ${#crate_files[@]} -ne 1 ]]; then
                    echo "##vso[task.logissue type=error]Expected exactly one $(crateName) .crate file; found ${#crate_files[@]}."
                    exit 1
                  fi

                  cp "${crate_files[0]}" "$release_dir/"
                  tar -tzf "$release_dir/$(basename "${crate_files[0]}")" >/dev/null
                  ls -la "$release_dir"
                displayName: Build and verify crate package

      - stage: Release
        displayName: Publish crate
        dependsOn: Build
        condition: and(succeeded(), eq(${{ parameters.dryRun }}, false))
        jobs:
          - job: Publish
            displayName: Publish ms-mqtt-client to crates.io
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: ms-mqtt-client-crate
                  targetPath: $(Pipeline.Workspace)/rust-packages
            steps:
              - task: EsrpRelease@14
                displayName: Publish to crates.io
                inputs:
                  connectedservicename: $(ESRP_SERVICE_CONNECTION)
                  usemanagedidentity: true
                  keyvaultname: $(ESRP_KEYVAULT_NAME)
                  signcertname: $(ESRP_SIGN_CERT_NAME)
                  clientid: $(ESRP_CLIENT_ID)
                  intent: PackageDistribution
                  contenttype: Rust
                  contentsource: Folder
                  folderlocation: $(Pipeline.Workspace)/rust-packages
                  waitforreleasecompletion: true
                  owners: $(ESRP_OWNERS)
                  approvers: $(ESRP_APPROVERS)
                  serviceendpointurl: https://api.esrp.microsoft.com
                  mainpublisher: ESRPRELPACMAN
                  domaintenantid: $(ESRP_DOMAIN_TENANT_ID)