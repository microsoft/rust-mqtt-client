[package]
name = "ms-mqtt-client"
version = "0.1.0"
edition = "2024"

[dependencies]
async-tungstenite = { workspace = true, optional = true, features = [
    "futures-03-sink",
    "tokio-runtime",
] }
bstr = { workspace = true }
bytes = { workspace = true }
derive-where = { workspace = true }
either = { workspace = true }
enum-iterator = { workspace = true }
futures-executor = { workspace = true, features = [
    "std", # for futures_executor::block_on
] }
futures-sink = { workspace = true }
futures-util = { workspace = true, features = [
    "std", # for futures_util::future::Shared
] }
hkdf = { workspace = true }
hmac = { workspace = true, features = [
    "reset", # for `hmac::Hmac::finalize_reset`
] }
indexmap = { workspace = true, features = ["std"] }
# for kTLS support
libc = { workspace = true }
log = { workspace = true }
nix = { workspace = true, features = ["net", "process", "socket", "zerocopy"] }
openssl = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
test-case = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tokio-openssl = { workspace = true }
unicode-properties = { workspace = true, features = [
    "general-category",
] }

[dev-dependencies]
env_logger = { workspace = true }
matches = { workspace = true }
paste = { workspace = true }
test-case = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "test-util",
] }

[features]
websockets = ["dep:async-tungstenite"]
# Internal feature used for integration tests
__integration = []

[lints]
workspace = true

[workspace]
members = [
    ".",
    "ffi",
]

[workspace.dependencies]
async-tungstenite = { version = "0.29", default-features = false }
bstr = { version = "1", default-features = false }
bytes = { version = "1", default-features = false }
derive-where = { version = "1", default-features = false }
either = { version = "1.6", default-features = false }
enum-iterator = { version = "2", default-features = false }
env_logger = { version = "0.10", default-features = false }
futures-executor = { version = "0.3", default-features = false }
futures-sink = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }
hkdf = { version = "0.12", default-features = false }
hmac = { version = "0.12", default-features = false }
indexmap = { version = "2.12", default-features = false }
# for kTLS support
libc = { version = "0.2.151", default-features = false }
log = { version = "0.4", default-features = false }
matches = { version = "0.1", default-features = false }
nix = { version = "0.30", default-features = false }
openssl = { version = "0.10", default-features = false }
parking_lot = { version = "0.12", default-features = false }
paste = { version = "1.0", default-features = false }
sha2 = { version = "0.10", default-features = false }
test-case = { version = "3", default-features = false }
thiserror = { version = "2", default-features = false }
tokio = { version = "1.38", default-features = false }
tokio-openssl = { version = "0.6", default-features = false }
unicode-properties = { version = "0.1", default-features = false }

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
default_trait_access = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
too_many_lines = "allow"
type_complexity = "allow"
