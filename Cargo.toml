[package]
name = "ms-mqtt-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A correctness-first, control-first async MQTT 5 client library."
readme = "README.md"
publish = true

[dependencies]
async-tungstenite = { version = "0.29", optional = true, default-features = false, features = [
    "futures-03-sink",
    "tokio-runtime",
] }
bstr = { version = "1", default-features = false }
# >= 1.11.1: RUSTSEC-2026-0007 (integer overflow in `BytesMut::reserve`).
bytes = { version = "1.11.1", default-features = false }
derive-where = { version = "1", default-features = false }
either = { version = "1.6", default-features = false }
enum-iterator = { version = "2", default-features = false }
futures-executor = { version = "0.3.31", default-features = false, features = [
    "std", # for futures_executor::block_on
] }
futures-util = { version = "0.3.31", default-features = false, features = [
    "std", # for futures_util::future::Shared
] }
indexmap = { version = "2.12", default-features = false, features = ["std"] }
log = {version = "0.4.8", default-features = false }
# >= 0.10.72 to clear known RustSec advisories (verified via `cargo deny check advisories`).
openssl = { version = "0.10.72", default-features = false }
thiserror = { version = "2.0.7", default-features = false }
# >= 1.38.2: RUSTSEC-2025-0023 (broadcast channel unsoundness).
tokio = { version = "1.38.2", default-features = false, features = ["io-util", "net", "sync", "time"] }
tokio-openssl = { version = "0.6", default-features = false }
unicode-properties = { version = "0.1", default-features = false, features = [
    "general-category",
] }

[dev-dependencies]
env_logger = {version = "0.10", default-features = false }
matches = { version = "0.1.9", default-features = false }
pastey = { version = "0.2", default-features = false }
test-case = { version = "3.1", default-features = false }
tokio = { version = "1.38.2", default-features = false, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "test-util",
] }

[features]
websockets = ["dep:async-tungstenite"]
# Internal feature: exposes internal modules for integration testing the crate.
# NOT part of the public, semver-stable API; do not enable as a consumer.
__integration = []
# Internal feature: exposes internal modules for fuzzing the crate.
# NOT part of the public, semver-stable API; do not enable as a consumer.
__fuzzing = []
# Internal feature: enables the live network test suites (tests/network/), which
# require a running broker.
# NOT part of the public, semver-stable API; do not enable as a consumer.
__network = []

# The live network suite.
# Declared explicitly because `required-features` only applies to manifest-declared
# targets -- and because files under `tests/network/` are not auto-discovered (Cargo only
# picks up `tests/*.rs` and `tests/*/main.rs`), so this entry is what makes the suite exist.
[[test]]
name = "network"
path = "tests/network/suite.rs"
required-features = ["__network", "websockets"]

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
default_trait_access = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
too_many_lines = "allow"
type_complexity = "allow"
