# Daily tests against additional Rust versions and external documentation links.
# These detect upstream changes even when this repository has not changed.
# PRs changing the listed workflow inputs also run these jobs, but check links
# offline so external website outages do not block those PRs.
# Dependency advisory scanning is handled separately by advisories.yaml.

name: 'Nightly'

on:
  pull_request:
    paths:
      - '.github/workflows/nightly.yaml'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'Makefile'
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC daily, on the default branch only.
  workflow_dispatch:

# PR validation must not cancel the scheduled run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cargo.lock is not committed, so newly resolved dependencies can break an
  # older Rust build without a library change. Check the minimum version daily.
  # Nightly Rust failures are allowed and do not trigger failure issues.
  test:
    name: Test (rust ${{ matrix.rust }})
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 15
    continue-on-error: ${{ matrix.rust == 'nightly' }}

    strategy:
      fail-fast: false
      matrix:
        # Keep "1.88" in sync with `rust-version` in Cargo.toml when bumping MSRV.
        rust: ["1.88", "stable", "beta", "nightly"]

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: Setup Rust (pinned via rust-toolchain.toml)
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        cache: false
        # New compiler warnings must not fail tests; only the pinned Clippy check denies warnings.
        rustflags: ''
        build-warnings: ''

    - name: Install Rust ${{ matrix.rust }}
      run: rustup toolchain install ${{ matrix.rust }} --profile minimal

    - name: Cache cargo build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: nightly-test-${{ matrix.rust }}

    # RUSTUP_TOOLCHAIN overrides the rust-toolchain.toml pin, selecting the
    # matrix toolchain without deleting the pin file.
    - name: Test
      env:
        RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      run: make -j test

  links:
    name: ${{ github.event_name == 'pull_request' && 'Link action dependency validation' || 'Documentation links (online)' }}
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: Check Markdown links
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        # Test the link-checking action on PRs without depending on external websites.
        args: ${{ github.event_name == 'pull_request' && '--offline --include-fragments --no-progress' || '--include-fragments --no-progress --timeout 30 --max-retries 2' }} '**/*.md'
        fail: true

  # Only scheduled and manual runs create failure issues. Allowed nightly-Rust
  # failures do not count as workflow failures.
  notify:
    name: Report failure
    needs: [test, links]
    if: failure() && github.event_name != 'pull_request'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
    - name: Open or update tracking issue
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        title="Nightly workflow failed"
        body="The Nightly workflow failed. See the failing jobs and logs: ${RUN_URL}"
        labels="$(
          gh api --paginate "repos/${GITHUB_REPOSITORY}/labels?per_page=100" \
            --jq '.[].name'
        )"
        if ! grep -Fxiq -- "ci-failure" <<<"${labels}"; then
          gh label create "ci-failure" --repo "${GITHUB_REPOSITORY}" \
            --color "b60205" --description "A CI check failed and needs investigation"
        fi
        if ! grep -Fxiq -- "workflow:nightly" <<<"${labels}"; then
          gh label create "workflow:nightly" --repo "${GITHUB_REPOSITORY}" \
            --color "1d76db" --description "Failure reported by the Nightly workflow"
        fi
        number="$(
          gh issue list --repo "${GITHUB_REPOSITORY}" --state open --type Bug \
            --json number,title \
            --jq "[.[] | select(.title == \"${title}\")][0].number // empty"
        )"
        if [ -n "${number}" ]; then
          gh issue edit "${number}" --repo "${GITHUB_REPOSITORY}" \
            --add-label "ci-failure" --add-label "workflow:nightly"
          gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
        else
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}" \
            --type Bug --label "ci-failure" --label "workflow:nightly"
        fi
