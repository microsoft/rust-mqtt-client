# Nightly: scheduled, non-blocking checks. Complements the `pr.yaml` gate.
#
# Guiding principles (kept consistent with `pr.yaml`):
#
#   1. Gate vs. nightly. This workflow owns everything that can go red because
#      the *outside world moved* rather than because our code changed -- so it
#      must not gate PRs. That includes: toolchains beyond MSRV+stable (beta and
#      nightly, to get early warning of future breakage) and external documentation
#      links (third-party sites can change or go down). Dependency advisories have
#      their own workflow (`advisories.yaml`) so triage cannot obscure test failures.
#      Since a scheduled run has no PR to turn red, the `notify` job opens a tracking
#      issue on failure. Deterministic, code-caused checks belong in the gate.
#
#   2. Static analysis vs. running tests. Same split as the gate: static
#      analysis is a single-toolchain concern and is NOT re-run per toolchain
#      here. What this workflow adds is running the tests against *more*
#      versions than the gate can hold stable -- extra toolchains.

name: 'Nightly'

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC (04:00 PT) daily. Scheduled runs fire on the default branch only.
  workflow_dispatch:

# Only one scheduled run at a time.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Test across the moving toolchains the PR gate can't hold stable. The MSRV
  # (1.88) is included because dependency versions float (Cargo.lock is not
  # committed): a dependency can raise its own MSRV and break our 1.88 build
  # with no code change on our side -- something the PR gate only catches when
  # a PR happens to run. `nightly` is allowed to fail (continue-on-error) --
  # it's an early-warning signal, not a gate -- so a broken nightly compiler
  # won't trip the failure notification.
  test:
    name: Test (rust ${{ matrix.rust }})
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 15
    continue-on-error: ${{ matrix.rust == 'nightly' }}

    strategy:
      fail-fast: false
      matrix:
        # Keep "1.88" in sync with `rust-version` in Cargo.toml when bumping MSRV.
        rust: ["1.88", "stable", "beta", "nightly"]

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: Setup Rust (pinned via rust-toolchain.toml)
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        # No `-D warnings`: this workflow runs tests across moving toolchains,
        # and a newer compiler's freshly-added warnings must not fail the run.
        rustflags: ''

    - name: Install Rust ${{ matrix.rust }}
      run: rustup toolchain install ${{ matrix.rust }} --profile minimal

    - name: Cache cargo build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: nightly-test-${{ matrix.rust }}

    # RUSTUP_TOOLCHAIN overrides the rust-toolchain.toml pin, selecting the
    # matrix toolchain without deleting the pin file.
    - name: Test
      env:
        RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      run: make -j test

  links:
    name: Documentation links (online)
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: Check Markdown links
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: --include-fragments --no-progress --timeout 30 --max-retries 2 '**/*.md'
        fail: true

  # Scheduled runs have no PR to turn red and no author watching, so surface
  # failures by opening (or updating) a tracking issue. nightly-toolchain
  # failures are neutralized by continue-on-error above and won't reach here.
  notify:
    name: Report failure
    needs: [test, links]
    if: failure()
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
    - name: Open or update tracking issue
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        title="Nightly workflow failed"
        body="The scheduled nightly workflow failed. Run: ${RUN_URL}"
        labels="$(
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/labels?per_page=100" \
            --jq '.[][] | .name'
        )"
        if ! grep -Fxiq -- "ci-failure" <<<"${labels}"; then
          gh label create "ci-failure" --repo "${GITHUB_REPOSITORY}" \
            --color "b60205" --description "A CI check failed and needs investigation"
        fi
        if ! grep -Fxiq -- "workflow:nightly" <<<"${labels}"; then
          gh label create "workflow:nightly" --repo "${GITHUB_REPOSITORY}" \
            --color "1d76db" --description "Failure reported by the Nightly workflow"
        fi
        number="$(
          gh issue list --repo "${GITHUB_REPOSITORY}" --state open --type Bug \
            --json number,title \
            --jq "[.[] | select(.title == \"${title}\")][0].number // empty"
        )"
        if [ -n "${number}" ]; then
          gh issue edit "${number}" --repo "${GITHUB_REPOSITORY}" \
            --add-label "ci-failure" --add-label "workflow:nightly"
          gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
        else
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}" \
            --type Bug --label "ci-failure" --label "workflow:nightly"
        fi
