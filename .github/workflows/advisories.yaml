# Dependency findings need applicability triage, independently of Nightly test failures.
# Keep both resolutions: a clean latest graph says nothing about older supported versions.
name: 'Dependency advisories'

on:
  # Keep a required check present even when no advisory scan is needed.
  pull_request:
  schedule:
    - cron: '30 11 * * *'   # Daily, staggered after Nightly and before Fuzz.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PRs can stop; issue-reporting runs must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Determine advisory scan requirements
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    outputs:
      scan_required: ${{ steps.changes.outputs.scan_required }}

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Compare advisory inputs
      id: changes
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          changed_files="$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" -- Cargo.toml deny.toml)"
          if [ -n "$changed_files" ]; then
            echo "Full advisory matrix required: $changed_files"
            echo "scan_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cargo.toml and deny.toml are unchanged; the full matrix is not required."
            echo "scan_required=false" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "scan_required=true" >> "$GITHUB_OUTPUT"
        fi

  scan:
    name: Scan (${{ matrix.deps }} dependencies)
    needs: changes
    if: needs.changes.outputs.scan_required == 'true'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        deps: ["latest", "minimal"]

    steps:
    - name: Prepare report directory
      env:
        REPORT_DIR: ${{ runner.temp }}/dependency-advisories-${{ matrix.deps }}
      run: |
        mkdir -p "$REPORT_DIR"
        printf 'REPORT_DIR=%s\n' "$REPORT_DIR" >> "$GITHUB_ENV"

    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - name: Setup Rust (pinned via rust-toolchain.toml)
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
        rustflags: ''
        build-warnings: ''

    - name: Install nightly Rust (for the minimal-versions resolver)
      if: matrix.deps == 'minimal'
      run: rustup toolchain install nightly --profile minimal

    - name: Install cargo-deny
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        # The reporter consumes this version's structured diagnostics.
        tool: cargo-deny@0.20.2

    - name: Resolve latest compatible dependencies
      if: matrix.deps == 'latest'
      run: cargo generate-lockfile 2>&1 | tee "$REPORT_DIR/resolution.log"

    - name: Resolve minimum direct dependencies
      if: matrix.deps == 'minimal'
      run: cargo +nightly generate-lockfile -Z direct-minimal-versions 2>&1 | tee "$REPORT_DIR/resolution.log"

    - name: Check advisories
      run: |
        cp Cargo.lock "$REPORT_DIR/Cargo.lock"
        set +e
        cargo deny --format json check advisories --audit-compatible-output \
          >"$REPORT_DIR/advisories.jsonl" 2>"$REPORT_DIR/diagnostics.jsonl"
        status=$?
        set -e
        printf '%s\n' "$status" >"$REPORT_DIR/exit-code.txt"
        echo "cargo-deny exited with status $status; full diagnostics are in the scan artifact."
        exit "$status"

    - name: Verify scan completeness
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        import sys

        sys.path.insert(0, ".github/scripts")
        from report_advisories import read_scan

        read_scan(Path(os.environ["REPORT_DIR"]))
        print("Advisory scan report is complete.")
        PY

    - name: Upload scan report
      if: always() && !cancelled()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dependency-advisories-${{ matrix.deps }}
        path: ${{ env.REPORT_DIR }}
        if-no-files-found: error
        retention-days: 14

  report:
    name: Report dependency findings
    needs: scan
    if: always() && !cancelled() && github.event_name != 'pull_request'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    # Share the lock with Copilot's queue readers/writers, not just other scan runs.
    concurrency:
      group: dependency-advisory-state-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: write

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      id: checkout

    - name: Download scan reports
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: dependency-advisories-*
        path: ${{ runner.temp }}/advisory-reports

    - name: Open or update dependency issues
      if: always() && !cancelled() && steps.checkout.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SCAN_RESULT: ${{ needs.scan.result }}
      run: |
        python3 .github/scripts/report_advisories.py \
          --reports "$RUNNER_TEMP/advisory-reports" \
          --repository "$GITHUB_REPOSITORY" \
          --run-url "$RUN_URL" \
          --scan-result "$SCAN_RESULT" \
          --summary "$GITHUB_STEP_SUMMARY"

  validation:
    name: Dependency advisory validation
    needs: [changes, scan]
    if: always() && github.event_name == 'pull_request'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    permissions: {}

    steps:
    - name: Require the applicable matrix result
      env:
        DETECTION_RESULT: ${{ needs.changes.result }}
        SCAN_REQUIRED: ${{ needs.changes.outputs.scan_required }}
        SCAN_RESULT: ${{ needs.scan.result }}
      run: |
        if [ "$DETECTION_RESULT" != "success" ]; then
          echo "::error::Advisory input detection did not succeed."
          exit 1
        fi
        case "$SCAN_REQUIRED:$SCAN_RESULT" in
          false:skipped)
            echo "Cargo.toml and deny.toml are unchanged; the full matrix is not required."
            ;;
          true:success)
            echo "Both latest and minimum-direct advisory scans passed."
            ;;
          *)
            echo "::error::Advisory matrix did not pass: required=$SCAN_REQUIRED, result=$SCAN_RESULT."
            exit 1
            ;;
        esac
