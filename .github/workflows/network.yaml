# Test the library against each configured MQTT broker, using the same test suite.
# Run daily, manually, and on PRs changing the listed workflow or broker setup inputs.
# Ordinary PRs use only Mosquitto in pr.yaml.
# Brokers run locally in containers or Kubernetes. Any future hosted broker
# requiring credentials must use an approval-protected environment, not fork PR secrets.

name: 'Network'

on:
  pull_request:
    paths:
      - '.github/workflows/network.yaml'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'tests/network/fixtures/**'
  schedule:
    # 13:00 UTC daily, one hour after Fuzz's scheduled start.
    - cron: '0 13 * * *'
  workflow_dispatch:

# Cancel older runs of the same PR or branch, not runs for other PRs or branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  network:
    name: ${{ github.event_name == 'pull_request' && 'Broker dependency validation' || 'Network' }} (${{ matrix.broker }})
    runs-on: 'ubuntu-24.04'
    # AIO MQ needs a local Kubernetes cluster and operator before tests can start.
    timeout-minutes: 25
    # Scheduled/manual AIO MQ failures are allowed. PR setup failures are not;
    # only its protocol test failures are optional on PRs.
    continue-on-error: ${{ github.event_name != 'pull_request' && startsWith(matrix.broker, 'aio-mq') }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - broker: mosquitto
          - broker: emqx
          - broker: hivemq-ce
          - broker: aio-mq
            kubernetes: true
          # TEMPORARY (remove by 2027-03 with the feature): AIO MQ before 1.6.2 omits the
          # Authentication Method, which only `__allow_omitted_auth_method` accepts.
          - broker: aio-mq-1.6.1
            kubernetes: true
            features: __allow_omitted_auth_method

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    # Kubernetes-backed brokers need Helm and k3d; kubectl is already on the runner.
    - name: Install Helm
      if: matrix.kubernetes
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: 'v3.16.3'

    - name: Install k3d
      if: matrix.kubernetes
      run: |
        curl -fsSL -o /usr/local/bin/k3d \
          https://github.com/k3d-io/k3d/releases/download/v5.7.5/k3d-linux-amd64
        chmod +x /usr/local/bin/k3d
        k3d version

    - name: Setup Rust (pinned via rust-toolchain.toml)
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        # Swatinem/rust-cache (below) handles caching, including target/.
        cache: false
        # Disable action-level warning-denial; only pinned-toolchain Clippy
        # (`make check`) should deny warnings (see pr.yaml).
        rustflags: ''
        build-warnings: ''

    - name: Cache cargo build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: network

    # Keep cleanup separate so it runs even when setup or testing fails or is cancelled.
    - name: Start the broker and test services
      run: tests/network/fixtures/up.sh ${{ matrix.broker }}

    - name: Test
      # Keep known AIO MQ test differences optional, but validate its PR setup.
      continue-on-error: ${{ github.event_name == 'pull_request' && startsWith(matrix.broker, 'aio-mq') }}
      env:
        MQTT_SERVER: ${{ matrix.broker }}
      run: cargo test --features "__network,websockets ${{ matrix.features }}" --test network

    - name: Stop the broker and test services
      if: always()
      run: tests/network/fixtures/down.sh ${{ matrix.broker }}

  # Only scheduled/manual failures create issues. Allowed AIO MQ failures do not
  # count as workflow failures.
  notify:
    name: Report failure
    needs: [network]
    if: failure() && github.event_name != 'pull_request'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
    - name: Open or update tracking issue
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        title="Network workflow failed"
        body="The Network workflow failed. See the failing jobs and logs: ${RUN_URL}"
        number="$(
          gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --json number,title \
            --jq "[.[] | select(.title == \"${title}\")][0].number // empty"
        )"
        if [ -n "${number}" ]; then
          gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
        else
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
        fi
