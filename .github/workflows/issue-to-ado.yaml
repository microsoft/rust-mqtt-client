name: 'Issue to ADO Bug'

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  create-ado-bug:
    name: Create ADO bug from issue
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10
    env:
      # Required repository secrets:
      # - ADO_ORG: Azure DevOps organization name (e.g. "contoso")
      # - ADO_PROJECT: Azure DevOps project name
      # - ADO_PAT: Azure DevOps personal access token with work item write permissions
      ADO_ORG: ${{ secrets.ADO_ORG }}
      ADO_PROJECT: ${{ secrets.ADO_PROJECT }}
      ADO_PAT: ${{ secrets.ADO_PAT }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      ISSUE_LABELS_JSON: ${{ toJson(github.event.issue.labels.*.name) }}
      REPOSITORY: ${{ github.repository }}
      SYNC_LABEL: synced-to-ado

    steps:
    - name: Verify required secrets
      run: |
        set -euo pipefail
        [ -n "${ADO_ORG}" ] || { echo "Missing secret: ADO_ORG"; exit 1; }
        [ -n "${ADO_PROJECT}" ] || { echo "Missing secret: ADO_PROJECT"; exit 1; }
        [ -n "${ADO_PAT}" ] || { echo "Missing secret: ADO_PAT"; exit 1; }

    - name: Check for existing sync label
      id: existing
      run: |
        set -euo pipefail
        labels="$(
          gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/labels" --paginate --jq '.[].name'
        )"
        if printf '%s\n' "${labels}" | grep -Fxq 'no-sync'; then
          echo "blocked_no_sync=true" >> "$GITHUB_OUTPUT"
        else
          echo "blocked_no_sync=false" >> "$GITHUB_OUTPUT"
        fi
        if printf '%s\n' "${labels}" | grep -Fxq "${SYNC_LABEL}"; then
          echo "already_synced=true" >> "$GITHUB_OUTPUT"
        else
          echo "already_synced=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Azure DevOps bug
      id: create
      if: steps.existing.outputs.blocked_no_sync != 'true' && steps.existing.outputs.already_synced != 'true'
      run: |
        set -euo pipefail

        labels="$(
          printf '%s' "${ISSUE_LABELS_JSON}" | jq -r '
            if type == "array" then
              map(select(type == "string" and length > 0)) | join(", ")
            else
              ""
            end
          '
        )"

        description="$(
          jq -rn \
            --arg repo "${REPOSITORY}" \
            --arg issue_number "${ISSUE_NUMBER}" \
            --arg issue_url "${ISSUE_URL}" \
            --arg author "${ISSUE_AUTHOR}" \
            --arg labels "${labels}" \
            --arg body "${ISSUE_BODY}" '
            [
              "<p>Synced from GitHub issue.</p>",
              "<ul>",
              "<li><strong>Repository:</strong> \($repo)</li>",
              "<li><strong>Issue:</strong> <a href=\"\($issue_url)\">#\($issue_number)</a></li>",
              "<li><strong>Author:</strong> \($author)</li>",
              "<li><strong>Labels:</strong> \((if $labels == "" then "(none)" else $labels end))</li>",
              "</ul>",
              "<hr/>",
              "<pre>\(($body // "") | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;"))</pre>"
            ] | join("\n")
          '
        )"

        patch="$(
          jq -nc \
            --arg issue_number "${ISSUE_NUMBER}" \
            --arg issue_title "${ISSUE_TITLE}" \
            --arg description "${description}" \
            --arg issue_url "${ISSUE_URL}" '
            ($issue_url | gsub("&"; "&amp;") | gsub("\""; "&quot;") | gsub("<"; "&lt;") | gsub(">"; "&gt;")) as $issue_url_html
            |
            [
              {"op":"add","path":"/fields/System.Title","value":"[GitHub #\($issue_number)] \($issue_title)"},
              {"op":"add","path":"/fields/System.Description","value":$description},
              {"op":"add","path":"/fields/System.Tags","value":"github;issue-sync"},
              {"op":"add","path":"/fields/System.History","value":"Source GitHub issue: <a href=\"\($issue_url_html)\">\($issue_url_html)</a>"}
            ]
          '
        )"

        auth_cfg="$(mktemp)"
        trap 'rm -f "${auth_cfg}"' EXIT INT TERM
        chmod 600 "${auth_cfg}"
        ado_pat_sanitized="$(printf '%s' "${ADO_PAT}" | tr -d '\r\n')"
        auth_b64="$(printf ':%s' "${ado_pat_sanitized}" | base64 | tr -d '\r\n')"
        printf 'header = "Authorization: Basic %s"\n' "${auth_b64}" > "${auth_cfg}"

        response="$(
          printf '%s' "${patch}" \
            | curl --silent --show-error --fail-with-body \
                -X POST \
                -H "Content-Type: application/json-patch+json" \
                --config "${auth_cfg}" \
                --data-binary @- \
                "https://dev.azure.com/${ADO_ORG}/${ADO_PROJECT}/_apis/wit/workitems/\$Bug?api-version=7.1"
        )"

        bug_id="$(printf '%s' "${response}" | jq -r '.id // empty')"
        if [ -z "${bug_id}" ]; then
          error_message="$(
            printf '%s' "${response}" \
              | jq -r '.message // .error.message // .typeKey // empty' 2>/dev/null || true
          )"
          echo "Failed to parse ADO bug id from API response."
          [ -n "${error_message}" ] && echo "API error: ${error_message}"
          exit 1
        fi
        echo "bug_id=${bug_id}" >> "$GITHUB_OUTPUT"
        {
          echo "### Created Azure DevOps bug"
          echo "- Bug ID: ${bug_id}"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Mark issue as synced
      if: steps.existing.outputs.blocked_no_sync != 'true' && steps.existing.outputs.already_synced != 'true' && steps.create.outputs.bug_id != ''
      run: |
        set -euo pipefail
        gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/labels" \
          -f labels[]="${SYNC_LABEL}"

    - name: Report existing sync
      if: steps.existing.outputs.already_synced == 'true'
      run: |
        {
          echo "### Azure DevOps sync already exists"
          echo "- GitHub issue is already labeled '${SYNC_LABEL}'; skipping duplicate creation."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Report no-sync label skip
      if: steps.existing.outputs.blocked_no_sync == 'true'
      run: |
        {
          echo "### Azure DevOps sync skipped"
          echo "- GitHub issue has label 'no-sync'; bug creation was skipped."
        } >> "$GITHUB_STEP_SUMMARY"
