# Fuzz: scheduled, non-blocking, coverage-guided fuzzing of the untrusted-input
# decoders. Deliberately its OWN workflow rather than part of `pr.yaml` or
# `nightly.yaml`, because fuzzing is a third category that fits neither:
#
#   - The PR gate owns DETERMINISTIC, code-caused checks. Fuzzing is
#     non-deterministic and open-ended (no "pass" state), so it can't gate a PR.
#     The gate only *compile-checks* the fuzz targets (the `fuzz` job there).
#   - `nightly.yaml` owns things that go red because the *outside world moved*
#     (new compilers, freshly-published advisories, dependency drift). A fuzz
#     crash is the opposite: a bug in OUR decoder, i.e. CODE-caused. It's
#     scheduled-not-gated only because it's non-deterministic and expensive.
#
# Keeping it separate also lets fuzzing evolve independently: its own schedule
# and time budget (which is meant to grow), its own concurrency (a long run
# must not be cancelled by, or hold up, the quick nightly checks), and a
# purpose-built crash report (upload the minimized reproducer, distinct issue).

name: 'Fuzz'

on:
  schedule:
    # 12:00 UTC (05:00 PT) daily -- staggered an hour after `nightly.yaml` so the
    # two scheduled workloads don't pile onto the same runner minute.
    - cron: '0 12 * * *'
  workflow_dispatch:

# One fuzzing run at a time; a newly-triggered run supersedes an in-flight one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Bounded, coverage-guided fuzzing. A crash fails the job (NOT
  # continue-on-error) so the `notify` job files a tracking issue -- a crash is
  # a real, actionable, potentially security-relevant finding.
  #
  # Budget: 60 min per target. The targets run in parallel across the matrix
  # (each on its own runner), so wall time stays ~60 min rather than 3x. Adjust
  # `max_total_time` to invest more or less once the targets prove their signal.
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: 'ubuntu-24.04'
    # 60 min fuzzing + instrumented build + tool install, with margin.
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        target: ["packet_decode", "packet_roundtrip", "topics"]

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: Setup Rust (pinned via rust-toolchain.toml)
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        rustflags: ''

    # cargo-fuzz builds with unstable `-Z sanitizer` + SanitizerCoverage flags,
    # so the instrumented target must be built on nightly (the library still
    # targets the pinned toolchain everywhere else).
    #
    # Explicitly add the glibc target: cargo-fuzz otherwise builds for the
    # runner's default host triple, which can resolve to a musl target. musl
    # links libc statically (`crt-static`), and ASan is incompatible with a
    # statically linked libc ("sanitizer is incompatible with statically linked
    # libc"); `--profile minimal` also ships std only for the host, so a musl
    # build fails with "can't find crate for `core`". Pinning glibc avoids both.
    - name: Install nightly Rust
      run: |
        rustup toolchain install nightly --profile minimal
        rustup target add x86_64-unknown-linux-gnu --toolchain nightly

    - name: Cache cargo build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # `fuzz/` is its own workspace; the instrumented build is cache-
        # incompatible with the gate's plain check, so key it separately.
        workspaces: fuzz
        shared-key: fuzz-${{ matrix.target }}

    # Persist the corpus across runs: restore the prior corpus, extend it this
    # run, save it back. This is what makes fuzzing compound over time rather
    # than starting cold each run.
    - name: Restore/persist fuzz corpus
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: fuzz/corpus/${{ matrix.target }}
        key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
        restore-keys: |
          fuzz-corpus-${{ matrix.target }}-

    - name: Install cargo-fuzz
      uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
      with:
        tool: cargo-fuzz

    # `--target x86_64-unknown-linux-gnu` pins the glibc target so the ASan-
    # instrumented build never falls back to a static-libc musl target (see the
    # nightly-install step for the failure modes that would cause).
    - name: Fuzz
      run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=3600

    # On a crash, cargo-fuzz writes a minimized reproducer under
    # fuzz/artifacts/<target>/. Upload it so the exact crashing input is
    # attached to the run for triage and can be committed as a regression test.
    - name: Upload crash reproducer
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-crash-${{ matrix.target }}
        path: fuzz/artifacts/${{ matrix.target }}
        if-no-files-found: ignore
        retention-days: 30

  # A crash has no PR to turn red and no author watching, so surface it by
  # opening (or updating) a tracking issue. The minimized reproducer is attached
  # to the run as an artifact (see the `fuzz` job's upload step).
  notify:
    name: Report crash
    needs: [fuzz]
    if: failure()
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
    - name: Open or update tracking issue
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        title="Fuzzing found a crash"
        body="A scheduled fuzzing run failed, which usually means a target found a crashing input. The minimized reproducer is attached to the run as a \`fuzz-crash-*\` artifact. Run: ${RUN_URL}"
        number="$(
          gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --json number,title \
            --jq "[.[] | select(.title == \"${title}\")][0].number // empty"
        )"
        if [ -n "${number}" ]; then
          gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
        else
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
        fi
