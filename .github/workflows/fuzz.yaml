# Fuzzing generates varied inputs to look for crashes in packet and topic handling.
# Scheduled and manual runs test each target for up to 60 minutes.
# PRs changing the listed inputs run the same setup and 30 seconds per target.
# Other PRs only check that the targets compile, in pr.yaml.
# Failing inputs are saved with the Actions run; only non-PR runs create issues.

name: 'Fuzz'

on:
  pull_request:
    paths:
      - '.github/workflows/fuzz.yaml'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'fuzz/Cargo.toml'
      - 'fuzz/fuzz_targets/**'
  schedule:
    # 12:00 UTC daily, one hour after Nightly's scheduled start.
    - cron: '0 12 * * *'
  workflow_dispatch:

# Cancel older runs of the same PR or branch, not runs for other PRs or branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Each target runs in its own job. Crashes fail the job and save the failing input.
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: 'ubuntu-24.04'
    # Allow time for setup and compilation in addition to the 60-minute scheduled run.
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        target: ["packet_decode", "packet_roundtrip", "topics"]

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: Setup Rust (pinned via rust-toolchain.toml)
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        cache: false
        rustflags: ''
        build-warnings: ''

    # cargo-fuzz needs nightly sanitizer support and the glibc target's standard
    # library. A musl target can link libc statically, which AddressSanitizer
    # cannot instrument.
    - name: Install nightly Rust
      run: |
        rustup toolchain install nightly --profile minimal
        rustup target add x86_64-unknown-linux-gnu --toolchain nightly

    - name: Cache cargo build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # Sanitizer-instrumented builds cannot share the ordinary fuzz compile-check cache.
        workspaces: fuzz
        shared-key: fuzz-${{ matrix.target }}

    # Reuse saved fuzz inputs (the corpus) so each run builds on earlier testing.
    - name: Restore and save fuzz test inputs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: fuzz/corpus/${{ matrix.target }}
        key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
        restore-keys: |
          fuzz-corpus-${{ matrix.target }}-

    - name: Install cargo-fuzz
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: cargo-fuzz

    - name: Fuzz
      env:
        FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '30' || '3600' }}
      run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time="$FUZZ_SECONDS"

    # Save the input that caused a crash so maintainers can reproduce the failure.
    - name: Upload failing fuzz inputs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-crash-${{ matrix.target }}
        path: fuzz/artifacts/${{ matrix.target }}
        if-no-files-found: ignore
        retention-days: 30

  # Report scheduled/manual failures, including setup and compilation failures.
  # Crash input files are available only when a fuzz target reached a crash.
  notify:
    name: Report crash
    needs: [fuzz]
    if: failure() && github.event_name != 'pull_request'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
    - name: Open or update tracking issue
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        # Keep the existing title: the lookup below uses it to find the tracking issue.
        title="Fuzzing found a crash"
        body="The Fuzz workflow failed during setup, compilation, or fuzzing. If a target crashed, its failing inputs are saved with the run as \`fuzz-crash-*\` artifacts. See the failing jobs and logs: ${RUN_URL}"
        number="$(
          gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --json number,title \
            --jq "[.[] | select(.title == \"${title}\")][0].number // empty"
        )"
        if [ -n "${number}" ]; then
          gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
        else
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
        fi
