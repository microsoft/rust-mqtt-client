# Checks for every pull request, pushes to main, and manual runs.
# Formatters and linters use the Rust version in rust-toolchain.toml.
# Tests cover the minimum supported Rust version and current stable Rust,
# each with the latest compatible and minimum direct dependency versions.
# Other workflows test additional compilers, brokers, and tools on a schedule
# and on PRs that change those workflows or their dependency inputs.

name: 'PR'

on:
  workflow_dispatch:
  pull_request:
  # Scoped to the default branch on purpose: `pull_request` already validates
  # every feature branch, so an unrestricted `push` would run each PR twice
  # (once per event). Keeping `push` on `main` validates the post-merge result.
  push:
    branches: [main]

# Only allow one run per branch at a time; cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    name: Workflow validation
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      with:
        persist-credentials: false

    - name: Install the actionlint workflow checker
      env:
        ACTIONLINT_VERSION: '1.7.12'
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run: |
        set -euo pipefail
        directory="$RUNNER_TEMP/actionlint"
        archive="$directory/actionlint.tar.gz"
        mkdir -p "$directory"
        curl --fail --silent --show-error --location --retry 3 \
          --output "$archive" \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
        tar --extract --gzip --file "$archive" --directory "$directory" --no-same-owner actionlint
        printf '%s\n' "$directory" >> "$GITHUB_PATH"

    - name: Install the gh-aw AI workflow compiler
      env:
        GH_AW_VERSION: v1.2.2
        GH_AW_SHA256: c2378d85466d29cdbdfebd0e513557b5cbec18d34f44e7cc00c2fa323687a153
      run: |
        set -euo pipefail
        directory="$RUNNER_TEMP/gh-aw-compiler"
        mkdir -p "$directory"
        curl --fail --silent --show-error --location --retry 3 \
          --output "$directory/gh-aw" \
          "https://github.com/github/gh-aw/releases/download/${GH_AW_VERSION}/linux-amd64"
        printf '%s  %s\n' "$GH_AW_SHA256" "$directory/gh-aw" | sha256sum --check
        chmod +x "$directory/gh-aw"

    - name: Check workflow definitions for errors
      run: |
        "$RUNNER_TEMP/gh-aw-compiler/gh-aw" lint .github/workflows

    - name: Check that the AI workflow source compiles
      run: |
        "$RUNNER_TEMP/gh-aw-compiler/gh-aw" compile --no-emit --no-check-update

  # Keep formatter and linter results consistent by using one pinned Rust version.
  check:
    name: Check (pinned toolchain)
    needs: workflows
    if: ${{ !cancelled() }}
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10

    steps:
    - name: Require workflow validation
      env:
        WORKFLOW_RESULT: ${{ needs.workflows.result }}
      run: |
        if [ "$WORKFLOW_RESULT" != "success" ]; then
          echo "::error::Workflow validation did not succeed: $WORKFLOW_RESULT."
          exit 1
        fi

    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: Setup Rust (pinned via rust-toolchain.toml)
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        # Swatinem/rust-cache (below) handles caching, including target/,
        # which this action's built-in cache does not.
        cache: false
        # Disable action-level warning-denial. In v2, build-warnings defaults
        # to deny on Cargo 1.97+ independently of rustflags. Only pinned-toolchain
        # Clippy (`make check`) should deny warnings.
        rustflags: ''
        build-warnings: ''

    - name: Cache cargo build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: check

    - name: Install cargo tooling
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: cargo-machete,cargo-deny

    - name: Check
      run: make -j check

  # Local files and heading anchors are deterministic; external URLs are
  # checked separately by the nightly workflow.
  links:
    name: Documentation links (local)
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: Check local Markdown links
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: --offline --include-fragments --no-progress '**/*.md'
        fail: true

  # Fuzz targets have a separate Cargo workspace and use internal library APIs.
  # Every PR checks that they compile. The Fuzz workflow also runs them when
  # its workflow, toolchain, or dependency inputs change.
  fuzz:
    name: Fuzz targets compile (pinned toolchain)
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: Setup Rust (pinned via rust-toolchain.toml)
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        cache: false
        # No global warning-denial: the fuzz crate isn't held to the library's
        # warning-denial policy (see the `check` job).
        rustflags: ''
        build-warnings: ''

    - name: Cache cargo build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # Cache the separate fuzz workspace independently of the library builds.
        workspaces: fuzz
        shared-key: fuzz

    - name: Check fuzz targets
      run: cargo check --manifest-path fuzz/Cargo.toml

  # Run all four combinations of Rust version and dependency set.
  # "latest" selects the newest compatible versions. "minimal" selects the
  # lowest allowed direct dependencies; indirect dependencies resolve normally.
  # This checks both our declared minimums and compatibility with current Rust.
  test:
    name: Test (rust ${{ matrix.rust }}, ${{ matrix.deps }} deps)
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Keep "1.88" in sync with `rust-version` in Cargo.toml when bumping MSRV.
        rust: ["1.88", "stable"]
        deps: ["latest", "minimal"]

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: Setup Rust (pinned via rust-toolchain.toml)
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        cache: false
        # No global warning-denial on the toolchain matrix (see the `check` job).
        rustflags: ''
        build-warnings: ''

    # Nightly Rust selects minimum dependency versions with an unstable Cargo
    # option. The tests themselves still use the Rust version selected above.
    - name: Install nightly Rust (for the minimal-versions resolver)
      if: matrix.deps == 'minimal'
      run: rustup toolchain install nightly --profile minimal

    - name: Install Rust ${{ matrix.rust }}
      run: rustup toolchain install ${{ matrix.rust }} --profile minimal

    - name: Cache cargo build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # `deps` is part of the key: latest and minimal builds produce
        # incompatible target/ artifacts and must not share a cache.
        shared-key: test-${{ matrix.rust }}-${{ matrix.deps }}

    - name: Resolve direct dependencies to their minimum versions
      if: matrix.deps == 'minimal'
      run: cargo +nightly generate-lockfile -Z direct-minimal-versions

    # Override the development Rust version without changing rust-toolchain.toml.
    - name: Test
      env:
        RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      run: make -j test


  # Every PR tests real TCP connections against Mosquitto. Other tests here
  # inject decoded packets and do not exercise socket I/O or packet framing.
  # The Network workflow tests other brokers on a schedule and when its
  # workflow, manifests, toolchain, or broker setup files change.
  network-mosquitto:
    name: Network (mosquitto)
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 15

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: Setup Rust (pinned via rust-toolchain.toml)
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        cache: false
        # No global warning-denial here either (see the `check` job).
        rustflags: ''
        build-warnings: ''

    - name: Cache cargo build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # The `__network` feature builds a target the other jobs don't, so keep
        # its target/ separate from theirs.
        shared-key: network

    - name: Start the broker and test services
      run: tests/network/fixtures/up.sh mosquitto

    - name: Test
      env:
        MQTT_SERVER: mosquitto
      run: cargo test --features __network,websockets --test network

    - name: Stop the broker and test services
      if: always()
      run: tests/network/fixtures/down.sh mosquitto


  # Coverage uses one pinned Rust version for comparable results across PRs.
  # Its instrumented builds need a separate cache from ordinary test builds.
  coverage:
    name: Coverage (pinned toolchain)
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 20

    steps:
    - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: Setup Rust (pinned via rust-toolchain.toml)
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        cache: false
        # Warning-denial belongs to pinned-toolchain Clippy (see the `check` job).
        rustflags: ''
        build-warnings: ''

    - name: Cache cargo build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # Distinct from the `test` keys: instrumented builds must not share
        # target/ with them.
        shared-key: coverage

    - name: Install cargo tooling
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: cargo-llvm-cov

    - name: Coverage
      # Real broker traffic covers socket I/O that decoded-packet tests do not reach.
      run: make network-coverage BROKER=mosquitto

    - name: Upload coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-report
        path: target/llvm-cov/html
        if-no-files-found: error
        retention-days: 10
