name: 'Copilot Setup Steps'

on:
  workflow_dispatch:
  pull_request:
    paths:
    - '.github/workflows/copilot-setup-steps.yml'
  push:
    branches: [main]
    paths:
    - '.github/workflows/copilot-setup-steps.yml'

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: '0.12.5'
        enable-cache: false

    - name: Install MQTT specification MCP server
      run: |
        uv tool install --upgrade --python python3 mqtt-spec-mcp
        echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
