# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# NOTE: We intentionally do NOT configure version updates for the source code itself.
# This repository contains an OSS library, and routinely bumping dependency floors in manifests
# raises MSRV-like constraints for downstream consumers.  Critical security fixes are handled
# separately by GitHub's "Dependabot security updates" toggle (repo
# Settings > Security), which opens PRs only when an advisory matches.
#
# Only tooling-hygeine ecosystems are watched here - those aren't exposed to consumers,
# so pin-rot is pure downside.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
