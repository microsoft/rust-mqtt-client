# Update CI actions and test broker images, not the library's Cargo dependencies.
# Routinely raising minimum dependency versions would restrict downstream users.
# GitHub's separate Dependabot security-update setting handles matching advisories.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Broker image updates run the Network workflow's connection tests before merge.
  # These images are test infrastructure, not dependencies of consuming applications.
  # The AIO MQ chart version in tests/network/fixtures/brokers/aio-mq/up.sh and
  # the k3d/Helm versions in .github/workflows/network.yaml still need manual updates.
  - package-ecosystem: "docker-compose"
    directories:
      - "/tests/network/fixtures/brokers/*"
    schedule:
      interval: "weekly"
    groups:
      broker-images:
        patterns:
          - "*"