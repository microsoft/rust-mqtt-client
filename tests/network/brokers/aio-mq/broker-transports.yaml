# Stage 1 of the AIO MQ 1.6.0 workaround documented in up.sh: add MQTT/TLS and WS,
# then wait for the operator to add the TLS Secret mount to the frontend StatefulSet.
apiVersion: mqttbroker.iotoperations.azure.com/v1
kind: BrokerListener
metadata:
  name: listener
  namespace: default
spec:
  brokerRef: broker
  serviceName: aio-broker
  serviceType: LoadBalancer
  ports:
    - port: 1883
      protocol: Mqtt
    - port: 8883
      protocol: Mqtt
      tls:
        mode: Manual
        manual:
          secretRef: network-server-tls
    - port: 8083
      protocol: WebSockets