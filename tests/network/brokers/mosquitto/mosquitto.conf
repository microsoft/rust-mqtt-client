# Test-only broker config: unauthenticated and reachable from outside the container by
# design. Mosquitto 2.0 defaults to a loopback-only listener and denies anonymous clients,
# so both settings are required for the container to be usable from the host.
listener 1883 0.0.0.0
allow_anonymous true

listener 8883 0.0.0.0
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

listener 8884 0.0.0.0
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
cafile /mosquitto/config/certs/ca.crt
require_certificate true

listener 8083 0.0.0.0
protocol websockets

listener 8084 0.0.0.0
protocol websockets
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
